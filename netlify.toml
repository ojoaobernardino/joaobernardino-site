[build]
  publish = "."

# Zero Nóia saiu da página (10/09/2026): links antigos do pedágio caem na home
[[redirects]]
  from = "/go.html"
  to = "/"
  status = 301
[[redirects]]
  from = "/go"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=300"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
