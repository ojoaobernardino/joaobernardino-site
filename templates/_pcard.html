<a class="pcard{{ ' dest' if dest }}" href="{{ c.url }}"><span class="meta">{% if c.type == 'post' %}{{ c.cluster_name or 'Texto' }} · {{ c.reading }} min{% else %}{{ c.kicker or 'Página' }}{% endif %}</span><h3>{{ c.card_title or c.title }}</h3>{% if not compact %}<p>{{ c.card or c.description }}</p>{% endif %}<span class="go-link">{{ 'Ler' if c.type == 'post' else 'Conhecer' }}</span></a>
