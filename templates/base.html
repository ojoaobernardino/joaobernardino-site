<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title_tag }}</title>
<meta name="description" content="{{ page.description }}">
<meta name="robots" content="{{ 'noindex, nofollow' if page.draft else 'index, follow' }}">
<meta name="theme-color" content="#000000">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="canonical" href="{{ site.url }}{{ page.url }}">
<meta property="og:type" content="{{ 'article' if page.type == 'post' else 'website' }}">
<meta property="og:locale" content="pt_BR">
<meta property="og:url" content="{{ site.url }}{{ page.url }}">
<meta property="og:site_name" content="João Bêrnardino">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:image" content="{{ site.url }}{{ page.og_image }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
{% if page.type == 'post' %}<meta property="article:published_time" content="{{ page.date }}">
<meta property="article:modified_time" content="{{ page.updated }}">
<meta property="article:author" content="{{ site.url }}/sobre/">{% endif %}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title }}">
<meta name="twitter:description" content="{{ page.description }}">
<meta name="twitter:image" content="{{ site.url }}{{ page.og_image }}">
<link rel="icon" href="/fav/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/fav/icon-32.png">
<link rel="apple-touch-icon" href="/fav/apple-touch-icon.png">
<link rel="alternate" type="application/rss+xml" title="João Bêrnardino" href="/blog/feed.xml">
<link rel="preload" href="/fonts/inter-var-latin.woff2" as="font" type="font/woff2" crossorigin>
{% block preload %}{% endblock %}
<style>{{ css|safe }}</style>
<script type="application/ld+json">{{ page.jsonld|safe }}</script>
</head>
<body class="theme-{{ page.theme }}">
<header class="top"><div class="wrap">
  <a class="brand" href="{{ '#inicio' if page.url == '/sobre/' else '/sobre/' }}" aria-label="João Bêrnardino, sobre"><img src="/lobo-obra.svg" alt="João Bêrnardino" width="36" height="36"></a>
  <nav class="nav" aria-label="Menu">
    {% for item in site.nav %}<a href="{{ item.url }}"{% if item.section == page.section %} aria-current="page"{% endif %}>{{ item.label }}</a>{% endfor %}
  </nav>
</div></header>
<main id="inicio">
{% block content %}{% endblock %}
</main>
<footer class="foot"><div class="wrap">
  <nav class="f-nav" aria-label="Rodapé">{% for item in site.nav %}<a href="{{ item.url }}"{% if item.section == page.section %} aria-current="page"{% endif %}>{{ item.label }}</a>{% endfor %}</nav>
  <div class="f-soc">{% include "_social.html" %}</div>
  <p class="f-copy">© {{ site.year }} João Bêrnardino</p>
</div></footer>
<script>
document.querySelectorAll('form.signup').forEach(function(f){var i=f.querySelector('input[type=email]'),o=f.parentNode.querySelector('.signup-ok'),b=f.querySelector('button');
f.addEventListener('submit',function(e){e.preventDefault();if(f.website&&f.website.value)return;if(!i.value||!i.checkValidity()){o.textContent='Confira o e-mail.';o.hidden=false;i.focus();return;}
b.disabled=true;var t=b.textContent;b.textContent='Enviando...';
fetch('/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(new FormData(f)).toString()})
.then(function(r){if(!r.ok)throw 0;f.reset();o.textContent='Pronto! Você está na lista.';o.hidden=false;try{track('newsletter',{status:'ok'})}catch(x){}})
.catch(function(){o.textContent='Não deu certo agora. Tente de novo em instantes.';o.hidden=false;})
.finally(function(){b.disabled=false;b.textContent=t;});});});
</script>
<script>
var GA4_ID = 'G-5MSB6QLXN0';
function track(nome, extra) {
  var p = Object.assign({ botao: nome, pagina: location.pathname }, extra || {});
  try { if (window.fbq) fbq('trackCustom', 'ClickSite', p); } catch (e) {}
  try { if (window.gtag) gtag('event', 'click_site', p); } catch (e) {}
}
document.addEventListener('click', function (e) {
  var el = e.target.closest('a[data-track], a[rel~="sponsored"], a.cta, a.btn-checkout');
  if (el) track(el.getAttribute('data-track') || el.getAttribute('href'));
});
!function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};
if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];f._fbqSrc=v}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
fbq('init', '1374672797442818'); fbq('track', 'PageView');
window.addEventListener('load', function () {
  setTimeout(function () {
    var s = document.createElement('script'); s.async = true; s.src = window._fbqSrc; document.head.appendChild(s);
    var g = document.createElement('script'); g.async = true; g.src = 'https://www.googletagmanager.com/gtag/js?id=' + GA4_ID; document.head.appendChild(g);
    window.dataLayer = window.dataLayer || []; window.gtag = function () { dataLayer.push(arguments); };
    gtag('js', new Date()); gtag('config', GA4_ID);
  }, 2000);
});
</script>
<noscript><img height="1" width="1" style="display:none" alt="" src="https://www.facebook.com/tr?id=1374672797442818&ev=PageView&noscript=1"></noscript>
</body>
</html>
